[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/wawow830/sliver"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
sliver-desktop = { path = "crates/sliver-desktop" }
sliver-session = { path = "crates/sliver-session" }
sliver-bus = { path = "crates/sliver-bus" }
sliver-icons = { path = "crates/sliver-icons" }
sliver-cli = { path = "crates/sliver-cli" }
sliver-config = { path = "crates/sliver-config" }
sliver-agent = { path = "crates/sliver-agent" }
sliver-ipc = { path = "crates/sliver-ipc" }
sliver-proc = { path = "crates/sliver-proc" }
sliver-testbus = { path = "crates/sliver-testbus" }
sliver-hw = { path = "crates/sliver-hw" }
sliver-render = { path = "crates/sliver-render" }
sliverd = { path = "crates/sliverd" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
regex-lite = "0.1"
zbus = "5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rustix = { version = "1.1.5", features = ["event", "net", "fs", "mm", "process", "time"] }

# Rendering: pure Rust, no system libraries.
cosmic-text = "0.19"
resvg = { version = "0.48", default-features = false }
svgtypes = "0.16"
tiny-skia = "0.12"

thiserror = "2"
toml = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev]
# Keep target/ small: every peer has its own.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
