[package]
name = "sliverd"
version = "0.1.0"
edition = "2024"
description = "The Touch Bar's display server"
license = "MIT"

[dependencies]
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "renderer_pixman", "desktop", "backend_drm", "backend_libinput", "backend_udev"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
libc = "0.2"
