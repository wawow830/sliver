# Installed by sliverd. When tiny-dfr starts (sliverd's OnFailure= fallback, or by hand to go back
# to it), sliverd and its socket stop first, so the two never fight over the bar and an agent
# connecting can't reactivate sliverd. See packaging/systemd/sliverd.service for why this isn't
# Conflicts=. '-': never let this keep tiny-dfr (the safe fallback) from starting.
[Service]
ExecStartPre=+-/usr/bin/systemctl stop sliverd.socket sliverd.service
