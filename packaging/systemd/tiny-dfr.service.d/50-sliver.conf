# Installed by sliverd. When tiny-dfr starts (sliverd's OnFailure= fallback, or by hand), sliverd
# and its socket stop first, so an agent connecting can't reactivate sliverd. Not Conflicts=: see
# packaging/systemd/sliverd.service. '-': a failure here never keeps tiny-dfr from starting.
[Service]
ExecStartPre=+-/usr/bin/systemctl stop sliverd.socket sliverd.service
