<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sliver · swarm</title>
<style>
  :root {
    --bg: #07080c; --panel: rgba(255,255,255,0.025); --line: rgba(255,255,255,0.07);
    --text: #e6e8ee; --dim: #8a90a0; --faint: #4a4f5c;
    --gold: #fbbf24; --green: #4ade80; --accent: #7dd3fc;
    --sans: "Inter", "SF Pro Text", system-ui, sans-serif;
    --mono: "JetBrains Mono", "SF Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }
  body {
    display: grid; grid-template-rows: 64px 1fr auto; grid-template-columns: 300px 1fr 340px;
    grid-template-areas: "top top top" "board mesh feed" "bar bar bar";
    background: radial-gradient(ellipse 80% 70% at 50% 45%, #0d1220 0%, var(--bg) 70%);
  }

  /* header */
  header { grid-area: top; display: flex; align-items: center; gap: 28px; padding: 0 28px; border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand b { font-size: 20px; font-weight: 700; letter-spacing: -0.02em;
    background: linear-gradient(90deg, #e0f2fe, #a5b4fc); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand span { font: 500 12px var(--mono); color: var(--dim); letter-spacing: 0.12em; text-transform: uppercase; }
  .live { display: flex; align-items: center; gap: 8px; font: 600 11px var(--mono); letter-spacing: 0.14em; color: var(--green); }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; animation: breathe 2s ease-in-out infinite; }
  .live.replay { color: var(--gold); }
  .live.paused { color: var(--dim); }
  @keyframes breathe { 50% { opacity: 0.35; } }
  .stats { margin-left: auto; display: flex; gap: 34px; }
  .stat { text-align: right; }
  .stat .v { font: 600 20px var(--mono); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 10px; color: var(--dim); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 1px; }
  button.ghost { background: none; border: 1px solid var(--line); color: var(--dim); font: 500 11px var(--mono); letter-spacing: 0.1em;
    padding: 7px 12px; border-radius: 8px; cursor: pointer; transition: all .2s; }
  button.ghost:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

  /* side panels */
  aside { padding: 22px 22px 16px; overflow: hidden; display: flex; flex-direction: column; gap: 18px; min-height: 0; }
  #board { grid-area: board; border-right: 1px solid var(--line); }
  #feedwrap { grid-area: feed; border-left: 1px solid var(--line); }
  h3 { font: 600 10px var(--mono); color: var(--dim); letter-spacing: 0.16em; text-transform: uppercase; display: flex; justify-content: space-between; }
  h3 em { font-style: normal; color: var(--faint); }
  .progress { height: 4px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; margin-top: 10px; }
  .progress div { height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, #38bdf8, #a78bfa); transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; overflow: hidden; }
  .task { display: grid; grid-template-columns: 8px 34px 1fr; gap: 8px; align-items: baseline; font-size: 12.5px; line-height: 1.35; color: #c8ccd6;
    animation: rise .5s cubic-bezier(.2,.8,.2,1); }
  .task .dot { width: 6px; height: 6px; border-radius: 50%; align-self: center; }
  .task .id { font: 500 11px var(--mono); color: var(--dim); }
  .task .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task.open .t { color: var(--dim); }
  .ask { font-size: 12px; line-height: 1.4; color: #e9d9b0; padding: 8px 10px; border-radius: 8px; background: rgba(251,191,36,0.06); border: 1px solid rgba(251,191,36,0.15); }
  .ask b { font: 600 11px var(--mono); color: var(--gold); margin-right: 6px; }
  #board .grow { flex: 1; min-height: 0; overflow: hidden; }

  #feed { display: flex; flex-direction: column; gap: 2px; overflow: hidden; flex: 1; min-height: 0;
    mask-image: linear-gradient(to bottom, black 75%, transparent); -webkit-mask-image: linear-gradient(to bottom, black 75%, transparent); }
  .ev { display: grid; grid-template-columns: 38px 1fr; gap: 10px; padding: 7px 0; font-size: 12.5px; line-height: 1.4; border-bottom: 1px solid rgba(255,255,255,0.035);
    animation: rise .55s cubic-bezier(.2,.8,.2,1); }
  .ev time { font: 11px var(--mono); color: var(--faint); padding-top: 1px; }
  .ev .who { font-weight: 600; margin-right: 6px; }
  .ev .kind { font: 600 9.5px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; margin-right: 6px; background: rgba(255,255,255,0.05); color: var(--dim); }
  .ev .kind.k-land { color: var(--green); background: rgba(74,222,128,0.1); }
  .ev .kind.k-human { color: var(--gold); background: rgba(251,191,36,0.1); }
  .ev .kind.k-msg { color: #c4b5fd; background: rgba(196,181,253,0.08); }
  .ev .txt { color: #b7bcc8; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  @keyframes rise { from { opacity: 0; transform: translateY(-6px); } }

  /* mesh */
  #mesh { grid-area: mesh; position: relative; min-width: 0; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: default; }
  #spot { position: absolute; left: 24px; right: 24px; bottom: 20px; max-width: 760px; margin: 0 auto; padding: 14px 18px; border-radius: 14px;
    background: rgba(12,15,24,0.72); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: opacity .5s; min-height: 70px; }
  #spot .hd { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--dim); margin-bottom: 6px; }
  #spot .hd b { color: var(--text); font-size: 13px; }
  #spot .hd .sw { width: 8px; height: 8px; border-radius: 50%; }
  #spot .hd .meta { margin-left: auto; font: 11px var(--mono); color: var(--faint); }
  #spot p { font: 13px/1.55 var(--mono); color: #cfd5e2; min-height: 40px; }
  #spot p::after { content: "▍"; color: var(--accent); animation: breathe 1s steps(1) infinite; margin-left: 2px; }
  #spot .cmd { font: 12px var(--mono); color: var(--faint); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .4s; }
  #spot .cmd b { color: #6b7385; font-weight: 500; }

  /* touch bar */
  #bar { grid-area: bar; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 0 16px; border-top: 1px solid var(--line);
    background: linear-gradient(to bottom, rgba(255,255,255,0.015), transparent); }
  .tb { position: relative; width: min(1180px, 82vw); aspect-ratio: 2008 / 60; border-radius: 6px; background: #000; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 0 0 5px #15171c, 0 0 0 6px rgba(255,255,255,0.06), 0 14px 40px rgba(0,0,0,0.6); }
  .tb img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1.1s ease; image-rendering: auto; }
  .tb img.on { opacity: 1; }
  .tbcap { font: 11px var(--mono); color: var(--faint); letter-spacing: 0.04em; }
  .tbcap b { color: var(--dim); font-weight: 500; }

  #toasts { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; width: 80%; }
  .toast { padding: 9px 16px; border-radius: 999px; font-size: 12.5px;
    background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.28); color: #bbf7d0; white-space: nowrap; max-width: 80%; overflow: hidden; text-overflow: ellipsis;
    animation: toast 4.2s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes toast { 0% { opacity: 0; transform: translateY(-8px); } 10%, 80% { opacity: 1; transform: none; } 100% { opacity: 0; } }

  @media (max-width: 1100px) { body { grid-template-columns: 0 1fr 300px; } #board { display: none; } .stats { gap: 20px; } }
</style>
</head>
<body>
<header>
  <div class="brand"><b>sliver</b><span>swarm</span></div>
  <div class="live" id="live"><i></i><span>LIVE</span></div>
  <div class="stats">
    <div class="stat"><div class="v" id="s-agents">0</div><div class="k">agents</div></div>
    <div class="stat"><div class="v" id="s-tasks">0</div><div class="k">tasks done</div></div>
    <div class="stat"><div class="v" id="s-landed">0</div><div class="k">landed</div></div>
    <div class="stat"><div class="v" id="s-loc">0</div><div class="k">lines of rust</div></div>
    <div class="stat"><div class="v" id="s-msgs">0</div><div class="k">messages</div></div>
    <div class="stat"><div class="v" id="s-cost">$0</div><div class="k">spent</div></div>
  </div>
  <button class="ghost" id="replayBtn">▶ REPLAY</button>
</header>

<aside id="board">
  <div>
    <h3>Board <em id="b-count"></em></h3>
    <div class="progress"><div id="b-prog"></div></div>
  </div>
  <div class="grow">
    <h3>In progress</h3>
    <div class="list" id="b-doing"></div>
    <h3 style="margin-top:18px">Up next</h3>
    <div class="list" id="b-open"></div>
  </div>
  <div id="b-human-wrap">
    <h3>Needs you <em id="b-hcount"></em></h3>
    <div class="list" id="b-human"></div>
  </div>
</aside>

<main id="mesh">
  <canvas id="c"></canvas>
  <div id="toasts"></div>
  <div id="spot"><div class="hd"><span class="sw"></span><b></b><span class="st"></span><span class="meta"></span></div><p></p><div class="cmd"></div></div>
</main>

<aside id="feedwrap">
  <h3>Activity <em id="f-count"></em></h3>
  <div id="feed"></div>
</aside>

<section id="bar">
  <div class="tb" id="tb"></div>
  <div class="tbcap" id="tbcap">Touch Bar frames rendered by the swarm's own code</div>
</section>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const PALETTE = ["#7dd3fc", "#c4b5fd", "#f9a8d4", "#86efac", "#fdba74", "#a5b4fc", "#5eead4", "#fca5a5", "#d9f99d", "#93c5fd"];
const GOLD = "#fbbf24", GREEN = "#4ade80";
const CSSV = getComputedStyle(document.documentElement);
const SANS = CSSV.getPropertyValue("--sans").trim(), MONO = CSSV.getPropertyValue("--mono").trim();
const colorOf = {};
function color(name) {
  if (name === "human" || name === "?") return GOLD;
  if (!colorOf[name]) colorOf[name] = PALETTE[Object.keys(colorOf).length % PALETTE.length];
  return colorOf[name];
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hhmm = (t) => new Date(t * 1000).toTimeString().slice(0, 5);

// ------------------------------------------------------------------ animated counters
const counters = {};
function setStat(id, value, fmt = (v) => Math.round(v).toLocaleString()) {
  const c = counters[id] || (counters[id] = { from: 0, to: 0, t0: 0, fmt });
  if (c.to === value) return;
  c.from = c.cur ?? 0; c.to = value; c.t0 = performance.now(); c.fmt = fmt;
}
function tickCounters(now) {
  for (const [id, c] of Object.entries(counters)) {
    const k = Math.min(1, (now - c.t0) / 1200), e = 1 - Math.pow(1 - k, 3);
    c.cur = c.from + (c.to - c.from) * e;
    $(id).textContent = c.fmt(c.cur);
  }
}

// ------------------------------------------------------------------ world
const world = {
  nodes: new Map(),      // name -> {name, x, y, tx, ty, born, status, agent, ...}
  fx: [],                // transient effects
  pulses: new Map(),     // "a|b" -> last message time (edge glow)
  stats: { landed: 0, done: 0, msgs: 0 },
};
const human = { name: "you", x: 0, y: 0, open: 0, flash: 0 };

function ensureNode(name, from) {
  if (name === "human" || name === "?" || name === "pulse") return null;
  let n = world.nodes.get(name);
  if (!n) {
    const src = from && world.nodes.get(from);
    n = { name, x: src ? src.x : W / 2, y: src ? src.y : H / 2, tx: 0, ty: 0, born: performance.now(),
          status: "active", agent: "idle", tasks: [], activity: "", lastEv: 0, parent: from };
    world.nodes.set(name, n);
    color(name);
    layout();
  }
  return n;
}
function nodePos(name) {
  if (name === "human" || name === "?") return human;
  return world.nodes.get(name);
}

let W = 0, H = 0, DPR = 1;
const cv = $("c"), ctx = cv.getContext("2d");
function resize() {
  const r = $("mesh").getBoundingClientRect();
  DPR = window.devicePixelRatio || 1; W = r.width; H = r.height;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
}
function layout() {
  const list = [...world.nodes.values()].sort((a, b) => a.born - b.born);
  const cx = W / 2, cy = H * 0.42, R = Math.min(W * 0.36, H * 0.27);
  list.forEach((n, i) => {
    const a = -Math.PI / 2 + (i / Math.max(1, list.length)) * Math.PI * 2;
    n.tx = cx + Math.cos(a) * R; n.ty = cy + Math.sin(a) * R; n.angle = a;
  });
  human.x = cx; human.y = cy;
}
window.addEventListener("resize", resize);

// ------------------------------------------------------------------ effects
function fxMessage(from, to, col) { world.fx.push({ type: "msg", from, to, col, t0: performance.now(), dur: 1300 }); world.pulses.set([from, to].sort().join("|"), performance.now()); }
function fxRing(at, col, big = false) { world.fx.push({ type: "ring", at, col, t0: performance.now(), dur: big ? 1800 : 1200, big }); }
function fxLabel(at, text, col) {
  const now = performance.now(), busy = world.fx.filter((e) => e.type === "label" && e.at === at && now - e.t0 < 900).length;
  world.fx.push({ type: "label", at, text, col, t0: now, dur: 2200, dy: busy * 16 });
}
function toast(html) {
  const d = document.createElement("div"); d.className = "toast"; d.innerHTML = html;
  const box = $("toasts"); box.prepend(d); setTimeout(() => d.remove(), 4300);
  while (box.children.length > 1) box.lastChild.remove();
}

// ------------------------------------------------------------------ events -> visuals
const KIND_LABEL = { land: "landed", task: "task", say: "says", peer: "peer", human: "human", msg: "dm", system: "system" };
let feedCount = 0;
function feed(ev, animate = true) {
  const d = document.createElement("div"); d.className = "ev";
  if (!animate) d.style.animation = "none";
  const who = ev.by === "?" ? "human" : ev.by;
  let text = ev.text;
  if (ev.kind === "msg") text = `→ <b style="color:${color(ev.to)}">${esc(ev.to)}</b> ${esc(ev.text)}`; else text = esc(text);
  d.innerHTML = `<time>${hhmm(ev.at)}</time><div><span class="who" style="color:${color(who)}">${esc(who)}</span>` +
    `<span class="kind k-${ev.kind}">${KIND_LABEL[ev.kind] || ev.kind}</span><span class="txt">${text}</span></div>`;
  const f = $("feed"); f.prepend(d);
  while (f.children.length > 70) f.lastChild.remove();
  $("f-count").textContent = (++feedCount).toLocaleString();
}

function apply(ev, animate = true) {
  const by = ev.by === "?" ? "human" : ev.by;
  const src = nodePos(by);
  if (src && src !== human) src.lastEv = performance.now();
  const spawn = ev.kind === "peer" && /spawned ([a-z][\w-]*)/.exec(ev.text);
  if (spawn) {
    const n = ensureNode(spawn[1], by === "human" ? null : by);
    if (n && animate) { n.born = performance.now(); fxRing(n, color(n.name), true); if (src) fxMessage(by, n.name, color(by)); }
  } else if (by !== "human" && by !== "pulse") ensureNode(by);

  if (ev.kind === "msg") {
    world.stats.msgs++;
    if (animate) { ensureNode(ev.to); fxMessage(by, ev.to, color(by)); }
  } else if (ev.kind === "land") {
    world.stats.landed++;
    if (animate && src) {
      fxRing(src, GREEN, true); fxLabel(src, "landed", GREEN);
      toast(`<b style="color:${color(by)}">${esc(by)}</b> ${esc(ev.text.replace(/^landed on main: [0-9a-f]+ /, "landed "))}`);
    }
  } else if (ev.kind === "task") {
    const m = /^(added|claimed|done|released|dropped) (T\d+)/.exec(ev.text);
    if (m && m[1] === "done") { world.stats.done++; if (animate && src) { fxRing(src, color(by)); fxLabel(src, `✓ ${m[2]}`, color(by)); } }
    else if (m && m[1] === "claimed" && animate && src) fxLabel(src, m[2], color(by));
    else if (m && m[1] === "added" && animate && src) fxLabel(src, `+ ${m[2]}`, "#8a90a0");
  } else if (ev.kind === "say") {
    if (animate && src) { fxRing(src, color(by), true); for (const n of world.nodes.values()) if (n !== src) fxMessage(by, n.name, color(by)); }
  } else if (ev.kind === "human") {
    if (animate) {
      if (/answered|CHANGED/.test(ev.text)) { human.flash = performance.now(); fxRing(human, GOLD); }
      else if (src && src !== human) { fxMessage(by, "human", GOLD); human.flash = performance.now(); }
    }
  }
  if (feedEnabled) feed(ev, animate);
}

// ------------------------------------------------------------------ drawing
function drawNode(n, now) {
  const c = color(n.name), age = (now - n.born) / 900;
  const s = Math.min(1, age < 1 ? 1 - Math.pow(1 - age, 3) : 1);
  const r = 24 * s;
  if (r <= 0.5) return;
  const live = n.agent, working = live === "working", away = !live || live === "absent";
  const resting = n.status === "resting", waiting = n.status === "waiting" || live === "blocked";
  const recent = Math.max(0, 1 - (now - n.lastEv) / 2500);
  ctx.save();
  ctx.globalAlpha = away ? 0.35 : resting ? 0.55 : 1;
  // glow
  const glow = ctx.createRadialGradient(n.x, n.y, r * 0.4, n.x, n.y, r * (2.6 + recent));
  glow.addColorStop(0, hexA(c, working ? 0.22 : 0.08 + recent * 0.15)); glow.addColorStop(1, hexA(c, 0));
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(n.x, n.y, r * (2.6 + recent), 0, Math.PI * 2); ctx.fill();
  // body
  ctx.fillStyle = "#0b0e16"; ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = hexA(c, working ? 0.9 : 0.45);
  if (waiting) { ctx.strokeStyle = GOLD; ctx.setLineDash([3, 4]); }
  ctx.stroke(); ctx.setLineDash([]);
  // working: orbiting arc
  if (working) {
    const a = now / 700 + n.born;
    ctx.lineWidth = 2; ctx.strokeStyle = c; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(n.x, n.y, r + 6, a, a + 1.1); ctx.stroke();
    ctx.globalAlpha *= 0.4; ctx.beginPath(); ctx.arc(n.x, n.y, r + 6, a + Math.PI, a + Math.PI + 0.5); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // context usage arc (inner)
  if (n.ctx != null && r > 8) {
    ctx.lineWidth = 2; ctx.strokeStyle = hexA(c, 0.35); ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(n.x, n.y, r - 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, n.ctx / 100)); ctx.stroke();
  }
  // initial
  ctx.fillStyle = c; ctx.font = `600 ${Math.round(17 * s)}px ${SANS}`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(n.name[0].toUpperCase(), n.x, n.y + 1);
  // labels
  const below = n.y + r + 18;
  ctx.font = `600 13px ${SANS}`; ctx.fillStyle = "#e6e8ee";
  ctx.fillText(n.name, n.x, below);
  ctx.font = `11px ${MONO}`; ctx.fillStyle = "#8a90a0";
  const model = /sonnet/.test(n.model || "") ? "sonnet" : /haiku/.test(n.model || "") ? "haiku" : "opus";
  const st = waiting ? "waiting on you" : resting ? "resting" : away ? "offline" : (live || "idle");
  ctx.fillText(`${model} · ${st}`, n.x, below + 16);
  if (n.tasks && n.tasks.length) {
    const t = n.tasks[0]; let s2 = `${t.id} ${t.title}`; if (s2.length > 34) s2 = s2.slice(0, 33) + "…";
    ctx.fillStyle = hexA(c, 0.85); ctx.fillText(s2, n.x, below + 31);
  }
  ctx.restore();
}

function drawHuman(now) {
  const open = human.open, f = Math.max(0, 1 - (now - human.flash) / 1500);
  const r = 13 + f * 3;
  ctx.save();
  const pulse = open ? 0.5 + 0.5 * Math.sin(now / 500) : 0;
  const g = ctx.createRadialGradient(human.x, human.y, 2, human.x, human.y, 46);
  g.addColorStop(0, hexA(GOLD, 0.10 + 0.12 * pulse + 0.2 * f)); g.addColorStop(1, hexA(GOLD, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(human.x, human.y, 46, 0, Math.PI * 2); ctx.fill();
  ctx.translate(human.x, human.y); ctx.rotate(Math.PI / 4);
  ctx.fillStyle = "#0b0e16"; ctx.strokeStyle = hexA(GOLD, 0.8); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.rect(-r / 1.4, -r / 1.4, r * 1.41, r * 1.41); ctx.fill(); ctx.stroke();
  ctx.rotate(-Math.PI / 4);
  ctx.fillStyle = GOLD; ctx.font = `600 10px ${MONO}`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(open ? String(open) : "", 0, 1);
  ctx.font = `600 11px ${MONO}`; ctx.fillStyle = hexA(GOLD, 0.85);
  ctx.fillText(open ? `you · ${open} waiting` : "you", 0, r + 16);
  ctx.restore();
}

function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}

function frame(now) {
  try { draw(now); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}

function draw(now) {
  tickCounters(now);
  ctx.clearRect(0, 0, W, H);
  // subtle dot grid
  ctx.fillStyle = "rgba(255,255,255,0.035)";
  for (let x = 20; x < W; x += 28) for (let y = 20; y < H; y += 28) ctx.fillRect(x, y, 1, 1);

  const nodes = [...world.nodes.values()];
  for (const n of nodes) {
    n.x += (n.tx + Math.sin(now / 2400 + n.born) * 5 - n.x) * 0.06;
    n.y += (n.ty + Math.cos(now / 2900 + n.born) * 5 - n.y) * 0.06;
  }
  // mesh edges
  for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
    const a = nodes[i], b = nodes[j];
    const p = world.pulses.get([a.name, b.name].sort().join("|"));
    const k = p ? Math.max(0, 1 - (now - p) / 2500) : 0;
    ctx.strokeStyle = `rgba(160,180,220,${0.06 + k * 0.25})`; ctx.lineWidth = 1 + k;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  // human links (faint, dashed)
  ctx.setLineDash([2, 6]); ctx.strokeStyle = "rgba(251,191,36,0.08)"; ctx.lineWidth = 1;
  for (const n of nodes) { ctx.beginPath(); ctx.moveTo(human.x, human.y); ctx.lineTo(n.x, n.y); ctx.stroke(); }
  ctx.setLineDash([]);

  // effects under nodes
  world.fx = world.fx.filter((e) => now - e.t0 < e.dur);
  for (const e of world.fx) {
    const k = (now - e.t0) / e.dur;
    if (e.type === "ring") {
      const at = e.at, R = (e.big ? 90 : 55) * (1 - Math.pow(1 - k, 3)) + 24;
      ctx.strokeStyle = hexA(e.col, 0.55 * (1 - k)); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(at.x, at.y, R, 0, Math.PI * 2); ctx.stroke();
    } else if (e.type === "msg") {
      const a = nodePos(e.from), b = nodePos(e.to);
      if (!a || !b) continue;
      const ease = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      // slight curve
      const mx = (a.x + b.x) / 2 + (b.y - a.y) * 0.12, my = (a.y + b.y) / 2 - (b.x - a.x) * 0.12;
      for (let t = 0; t < 7; t++) {
        const q = Math.max(0, ease - t * 0.018), u = 1 - q;
        const x = u * u * a.x + 2 * u * q * mx + q * q * b.x, y = u * u * a.y + 2 * u * q * my + q * q * b.y;
        ctx.fillStyle = hexA(e.col, (t === 0 ? 0.95 : 0.35 * (1 - t / 7)) * (k > 0.9 ? (1 - k) * 10 : 1));
        ctx.beginPath(); ctx.arc(x, y, Math.max(0.5, t === 0 ? 3 : 2.2 - t * 0.2), 0, Math.PI * 2); ctx.fill();
      }
    }
  }
  drawHuman(now);
  for (const n of nodes) drawNode(n, now);
  for (const e of world.fx) if (e.type === "label") {
    const k = (now - e.t0) / e.dur;
    ctx.save(); ctx.globalAlpha = k < 0.15 ? k / 0.15 : 1 - Math.max(0, (k - 0.6) / 0.4);
    ctx.fillStyle = e.col; ctx.font = `600 12px ${MONO}`; ctx.textAlign = "center";
    ctx.fillText(e.text, e.at.x, e.at.y - 36 - (e.dy || 0) - k * 24); ctx.restore();
  }
}

// ------------------------------------------------------------------ live data
let replaying = false, feedEnabled = true, snap = null;
async function refresh() {
  if (replaying) return;
  try { snap = await (await fetch("/api/snapshot")).json(); } catch { return; }
  if (replaying) return;
  for (const p of snap.peers) {
    const n = ensureNode(p.name, p.spawned_by);
    Object.assign(n, { status: p.status, agent: p.agent || "absent", model: p.model, tasks: p.tasks, activity: p.activity, cmd: p.cmd,
                       ctx: p.ctx, cost: p.cost, knows: p.knows });
  }
  const live = new Set(snap.peers.map((p) => p.name));
  for (const name of [...world.nodes.keys()]) if (!live.has(name)) { world.nodes.delete(name); layout(); }
  human.open = snap.humans.length;
  renderBoard(snap.tasks, snap.humans);
  setStat("s-agents", snap.peers.length);
  setStat("s-loc", snap.repo.loc || 0);
  setStat("s-cost", snap.cost || 0, (v) => "$" + v.toFixed(2));
  setStat("s-landed", world.stats.landed);
  setStat("s-msgs", world.stats.msgs);
  setTB(snap.repo.snapshots || []);
  const l = $("live"); l.className = "live" + (snap.paused ? " paused" : ""); l.querySelector("span").textContent = snap.paused ? "PAUSED" : "LIVE";
}

function renderBoard(tasks, humans) {
  const done = tasks.filter((t) => t.status === "done").length, total = tasks.filter((t) => t.status !== "dropped").length;
  setStat("s-tasks", done);
  $("b-count").textContent = `${done} / ${total}`;
  $("b-prog").style.width = total ? `${(100 * done) / total}%` : "0";
  const doing = tasks.filter((t) => t.status === "claimed").sort((a, b) => +a.id.slice(1) - +b.id.slice(1));
  const open = tasks.filter((t) => t.status === "open").sort((a, b) => +a.id.slice(1) - +b.id.slice(1));
  diffList($("b-doing"), doing.map((t) => [t.id + t.owner, `<span class="dot" style="background:${color(t.owner)};box-shadow:0 0 8px ${color(t.owner)}"></span><span class="id">${t.id}</span><span class="t" title="${esc(t.title)}">${esc(t.title)}</span>`]), "task");
  diffList($("b-open"), open.slice(0, 8).map((t) => [t.id, `<span class="dot" style="background:#2a2f3a"></span><span class="id">${t.id}</span><span class="t">${esc(t.title)}</span>`]), "task open");
  $("b-hcount").textContent = humans.length || "";
  $("b-human-wrap").style.display = humans.length ? "" : "none";
  diffList($("b-human"), humans.slice(0, 3).map((h) => [h.id, `<b>${h.id}</b>${esc(h.text)}`]), "ask");
}
function diffList(el, items, cls) {
  const key = items.map((i) => i[0]).join(",");
  if (el.dataset.key === key) return;
  const old = new Set((el.dataset.key || "").split(","));
  el.dataset.key = key; el.innerHTML = "";
  for (const [k, html] of items) {
    const d = document.createElement("div"); d.className = cls; d.innerHTML = html;
    if (old.has(k)) d.style.animation = "none";
    el.appendChild(d);
  }
}

// ------------------------------------------------------------------ spotlight
let spotName = null, spotPinned = false, spotSince = 0, typed = "", target = "";
function pickSpot(now) {
  const nodes = [...world.nodes.values()].filter((n) => n.activity);
  if (!nodes.length) return;
  if (spotPinned && world.nodes.has(spotName)) return;
  if (spotName && now - spotSince < 9000 && world.nodes.has(spotName)) return;
  const working = nodes.filter((n) => n.agent === "working");
  const pool = working.length ? working : nodes;
  const i = pool.findIndex((n) => n.name === spotName);
  spotName = pool[(i + 1) % pool.length].name; spotSince = now; typed = "";
}
function spotTick(now) {
  pickSpot(now);
  const n = world.nodes.get(spotName), el = $("spot");
  if (!n || !n.activity) { el.style.opacity = 0; return; }
  el.style.opacity = 1;
  const c = color(n.name);
  el.querySelector(".sw").style.cssText = `background:${c};box-shadow:0 0 10px ${c}`;
  el.querySelector("b").textContent = n.name;
  el.querySelector(".st").textContent = n.agent === "working" ? "is thinking" : `is ${n.agent || "idle"}`;
  el.querySelector(".meta").textContent = [n.ctx != null ? `${n.ctx.toFixed(0)}% context` : "", n.cost != null ? `$${n.cost.toFixed(2)}` : "", spotPinned ? "pinned" : ""].filter(Boolean).join(" · ");
  if (target !== n.activity) { target = n.activity; if (!target.startsWith(typed.slice(0, 20))) typed = ""; }
  if (typed.length < target.length) typed = target.slice(0, typed.length + 3);
  else if (typed.length > target.length) typed = target;
  el.querySelector("p").textContent = typed;
  const cmd = el.querySelector(".cmd");
  cmd.innerHTML = n.cmd ? `<b>running ›</b> ${esc(n.cmd)}` : "";
  cmd.style.opacity = n.cmd && typed.length >= target.length ? 1 : 0;
}
cv.addEventListener("click", (e) => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const hit = [...world.nodes.values()].find((n) => Math.hypot(n.x - x, n.y - y) < 32);
  if (hit && spotPinned && spotName === hit.name) spotPinned = false;
  else if (hit) { spotName = hit.name; spotPinned = true; typed = ""; spotSince = performance.now(); }
  else spotPinned = false;
});
cv.addEventListener("mousemove", (e) => {
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  cv.style.cursor = [...world.nodes.values()].some((n) => Math.hypot(n.x - x, n.y - y) < 32) ? "pointer" : "default";
});

// ------------------------------------------------------------------ touch bar strip
let tbList = [], tbIdx = -1;
function setTB(list) {
  const pretty = list.filter((p) => !/failure/.test(p));
  if (pretty.join() === tbList.join()) return;
  tbList = pretty; const tb = $("tb"); tb.innerHTML = "";
  for (const p of tbList) { const img = new Image(); img.src = "/snap/" + p.split("/").pop(); img.dataset.path = p; tb.appendChild(img); }
  if (tbIdx < 0) cycleTB();
}
function cycleTB() {
  const imgs = $("tb").querySelectorAll("img");
  if (!imgs.length) return;
  tbIdx = (tbIdx + 1) % imgs.length;
  imgs.forEach((im, i) => im.classList.toggle("on", i === tbIdx));
  const p = imgs[tbIdx].dataset.path, crate = (p.match(/crates\/([^/]+)/) || [])[1] || "";
  $("tbcap").innerHTML = `Touch Bar frame <b>${esc(p.split("/").pop().replace(".png", ""))}</b>, rendered by <b>${esc(crate)}</b>, code the swarm wrote · ${tbIdx + 1}/${imgs.length}`;
}
setInterval(cycleTB, 4500);

// ------------------------------------------------------------------ stream + replay
let history = [];
function connect() {
  const es = new EventSource("/api/stream");
  es.addEventListener("history", (m) => {
    history = JSON.parse(m.data);
    if (replaying) return;
    world.stats = { landed: 0, done: 0, msgs: 0 }; $("feed").innerHTML = ""; feedCount = 0;
    for (const ev of history) apply(ev, false);
    setStat("s-landed", world.stats.landed); setStat("s-msgs", world.stats.msgs);
    if (new URLSearchParams(location.search).has("replay")) replay();
  });
  es.onmessage = (m) => {
    const ev = JSON.parse(m.data); history.push(ev);
    if (replaying) return;
    apply(ev, true);
    setStat("s-landed", world.stats.landed); setStat("s-msgs", world.stats.msgs);
  };
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}

async function replay() {
  if (replaying || !history.length) return;
  replaying = true;
  const l = $("live"); l.className = "live replay"; l.querySelector("span").textContent = "REPLAY";
  $("replayBtn").textContent = "■ STOP";
  world.nodes.clear(); world.fx = []; world.stats = { landed: 0, done: 0, msgs: 0 }; $("feed").innerHTML = ""; feedCount = 0;
  for (const k of ["s-agents", "s-tasks", "s-landed", "s-msgs"]) setStat(k, 0);
  human.open = 0; layout();
  try { const s = await (await fetch("/api/snapshot")).json(); setStat("s-loc", s.repo.loc || 0); setStat("s-cost", s.cost || 0, (v) => "$" + v.toFixed(2)); setTB(s.repo.snapshots || []); } catch {}
  const board = new Map();
  const evs = history.slice(), t0 = evs[0].at, span = Math.max(1, evs[evs.length - 1].at - t0);
  const scale = 75000 / span;          // whole history in about 75 s, gaps compressed
  for (let i = 0; i < evs.length && replaying; i++) {
    const ev = evs[i], dt = i ? (ev.at - evs[i - 1].at) * scale : 0;
    await new Promise((r) => setTimeout(r, Math.max(70, Math.min(1400, dt))));
    if (!replaying) break;
    apply(ev, true);
    const m = ev.kind === "task" && /^(added|claimed|done|released|dropped) (T\d+)(?:: (.*))?/.exec(ev.text);
    if (m) {
      const tk = board.get(m[2]) || { id: m[2], title: m[3] || m[2], status: "open", owner: null };
      if (m[1] === "claimed") Object.assign(tk, { status: "claimed", owner: ev.by });
      else if (m[1] === "done") tk.status = "done";
      else if (m[1] === "released") Object.assign(tk, { status: "open", owner: null });
      else if (m[1] === "dropped") tk.status = "dropped";
      board.set(m[2], tk);
      for (const n of world.nodes.values()) n.tasks = [...board.values()].filter((t) => t.status === "claimed" && t.owner === n.name);
      renderBoard([...board.values()], []);
    }
    if (ev.kind === "human" && !/answered|CHANGED/.test(ev.text)) human.open++;
    if (ev.kind === "human" && /answered/.test(ev.text)) human.open = Math.max(0, human.open - 1);
    for (const n of world.nodes.values()) n.agent = performance.now() - n.lastEv < 6000 ? "working" : "idle";
    setStat("s-agents", world.nodes.size); setStat("s-tasks", world.stats.done);
    setStat("s-landed", world.stats.landed); setStat("s-msgs", world.stats.msgs);
  }
  replaying = false; $("replayBtn").textContent = "▶ REPLAY";
  world.nodes.clear(); layout();
  world.stats = { landed: 0, done: 0, msgs: 0 }; $("feed").innerHTML = ""; feedCount = 0;
  for (const ev of history) apply(ev, false);
  refresh();
}
$("replayBtn").addEventListener("click", () => { if (replaying) replaying = false; else replay(); });

// ------------------------------------------------------------------ go
resize();
requestAnimationFrame(frame);
setInterval(() => spotTick(performance.now()), 40);
refresh(); setInterval(refresh, 2500);
connect();
</script>
</body>
</html>
