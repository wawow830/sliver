<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sliver, built live</title>
<style>
@font-face { font-family: "RH Display"; src: url(/font/RedHatDisplay-Medium.otf); font-weight: 500; font-display: swap; }
@font-face { font-family: "RH Display"; src: url(/font/RedHatDisplay-SemiBold.otf); font-weight: 600; font-display: swap; }
@font-face { font-family: "RH Text"; src: url(/font/RedHatText-Regular.otf); font-weight: 400; font-display: swap; }
@font-face { font-family: "RH Text"; src: url(/font/RedHatText-Medium.otf); font-weight: 500; font-display: swap; }

:root {
  --paper: #edf0eb;
  --ink: #17201b;
  --quiet: #5c6660;
  --line: #c9d1cb;
  --display: "RH Display", "Red Hat Display", system-ui, sans-serif;
  --text: "RH Text", "Red Hat Text", system-ui, sans-serif;
  --arcs: 210px;
}
* { box-sizing: border-box; }
html { background: var(--paper); color: var(--ink); }
body { margin: 0; font: 400 17px/1.45 var(--text); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

.page { max-width: 1380px; margin: 0 auto; padding: 28px 56px 64px; }

.top { display: flex; align-items: center; gap: 28px; }
.mark { font: 600 22px/1 var(--display); letter-spacing: -0.01em; margin-right: auto; }
.status { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--quiet); }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #3e7d36; }
.status.paused::before { background: #a7b0aa; }
.status.replay::before { background: var(--ink); }
button {
  font: 500 15px/1 var(--text); color: var(--ink); background: none;
  border: 1.5px solid var(--ink); border-radius: 999px; padding: 10px 18px; cursor: pointer;
}
button:hover { background: var(--ink); color: var(--paper); }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 4px; }
button:focus-visible { border-radius: 999px; }

.intro { margin: 44px 0 36px; }
h1 { font: 500 44px/1.12 var(--display); letter-spacing: -0.02em; margin: 0 0 16px; max-width: 21em; text-wrap: balance; }
.lead { margin: 0; max-width: 64ch; font-size: 19px; line-height: 1.5; color: var(--quiet); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 72px; align-items: start; }

/* the mesh: arcs on the left, one row per agent */
.mesh { position: relative; padding-left: var(--arcs); }
.mesh canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.legend {
  position: absolute; left: 0; bottom: 6px; width: calc(var(--arcs) - 56px);
  margin: 0; font-size: 13px; line-height: 1.4; color: var(--quiet);
}
.row {
  display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; column-gap: 16px;
  padding: 10px 0 14px; border-radius: 4px; transition: opacity .4s;
}
.name { font: 600 21px/1.25 var(--display); color: var(--c); }
.task { font-size: 15px; line-height: 1.6; color: var(--quiet); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cost { font-size: 15px; line-height: 1.6; color: var(--quiet); font-variant-numeric: tabular-nums; text-align: right; }
.thought {
  grid-column: 2 / 4; margin: 2px 0 0; max-width: 70ch;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.row:hover .thought, .row:focus-visible .thought { -webkit-line-clamp: 8; }
.row:not([data-state="working"]) .thought { color: var(--quiet); }
.row.unborn { opacity: .3; }

/* what they're saying */
.feed h2 { font: 600 17px/1.3 var(--display); margin: 14px 0 18px; }
.feed ol { list-style: none; margin: 0; padding: 0; }
.item { padding-bottom: 20px; }
.item .who { display: flex; align-items: baseline; gap: 6px; font-size: 15px; color: var(--quiet); }
.item .who b { font-weight: 500; color: var(--c); }
.item time { margin-left: auto; font-size: 13px; white-space: nowrap; }
.item p {
  margin: 3px 0 0; font-size: 15px; line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  overflow-wrap: anywhere;
}
.empty { color: var(--quiet); font-size: 15px; }

@media (max-width: 1100px) {
  .main { grid-template-columns: 1fr; gap: 40px; }
  :root { --arcs: 160px; }
}
@media (max-width: 680px) {
  .page { padding: 20px 20px 48px; }
  .intro { margin: 36px 0 28px; }
  h1 { font-size: 31px; }
  .lead { font-size: 17px; }
  :root { --arcs: 0px; }
  .mesh canvas, .legend { display: none; }
  .row { grid-template-columns: 64px minmax(0, 1fr) auto; column-gap: 12px; }
  .name { font-size: 19px; }
  .thought { grid-column: 1 / 4; }
  .long { display: none; }
}
@media (prefers-reduced-motion: reduce) { .row { transition: none; } }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="mark">sliver</div>
    <div class="status" id="status"><span id="statusText">Live</span></div>
    <button id="replay" type="button">Replay<span class="long"> the whole build</span></button>
  </header>

  <section class="intro">
    <h1 id="headline">AI agents are building sliver, a Touch Bar app for Linux. None of them is in charge.</h1>
    <p class="lead" id="lead">They split up the work themselves and message each other directly.</p>
  </section>

  <div class="main">
    <section class="mesh" id="mesh" aria-label="The agents and what each one is doing">
      <canvas id="arcs" aria-hidden="true"></canvas>
      <div id="rows"></div>
      <p class="legend">Each line is two agents talking. The thicker the line, the more they've said.</p>
    </section>

    <section class="feed" aria-live="polite">
      <h2>Latest messages</h2>
      <ol id="feed"><li class="empty">Waiting for the first message.</li></ol>
    </section>
  </div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const WORDS = ["No", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten"];
// Each agent is named after a tree, so each gets that tree's color.
const TREES = { ash: "#4a6d8f", birch: "#8f670c", cedar: "#a3412b", elm: "#3c7a35", fir: "#13625c", hazel: "#7a5130" };
const SPARE = ["#68598c", "#8c5876", "#4f7768", "#86672f"];
const YOU = "#17201b";

let snap = null, events = [], live = false, replay = null;
const joinOrder = [];
const who = (by) => (by === "?" ? "human" : by);
const label = (name) => (name === "human" ? "You" : name);
function color(name) {
  if (name === "human") return YOU;
  if (TREES[name]) return TREES[name];
  let i = joinOrder.indexOf(name); if (i < 0) i = joinOrder.length;
  return SPARE[i % SPARE.length];
}
function spawnedName(e) { const m = e.kind === "peer" && /spawned ([a-z][\w-]*)/.exec(e.text); return m && m[1]; }
const int = (v) => Math.round(v).toLocaleString("en-US");
function duration(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  const hs = `${h} hour${h === 1 ? "" : "s"}`, ms = `${m} minute${m === 1 ? "" : "s"}`;
  return h === 0 ? ms : m === 0 ? hs : `${hs} and ${ms}`;
}
function ago(at, now) {
  const s = Math.max(0, now - at);
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  return `${Math.floor(s / 3600)} h ago`;
}
const clock = (t) => new Date(t * 1000).toTimeString().slice(0, 5);
const visible = () => (replay ? events.filter((e) => e.at <= replay.at) : events);

// ------------------------------------------------------------------ links between agents
// A link is a pair of agents who have talked: a message either way, or a question to you.
function ends(e) {
  if (e.kind === "msg") return [who(e.by), e.to];
  if (e.kind === "human" && who(e.by) !== "human") return [who(e.by), "human"];
  return null;
}
function links(evs) {
  const m = new Map();
  for (const e of evs) {
    const p = ends(e); if (!p || p[0] === p[1]) continue;
    const key = [...p].sort().join("|");
    const l = m.get(key) || m.set(key, { a: p[0], b: p[1], n: 0, first: e.at }).get(key);
    l.n++;
  }
  return [...m.values()].sort((x, y) => x.first - y.first);
}

// ------------------------------------------------------------------ rows
const rows = new Map();
function row(name) {
  let r = rows.get(name);
  if (r) return r;
  const el = document.createElement("article");
  el.className = "row"; el.tabIndex = 0; el.dataset.state = "idle";
  el.style.setProperty("--c", color(name));
  el.innerHTML = `<div class="name"></div><div class="task"></div><div class="cost"></div><p class="thought"></p>`;
  el.querySelector(".name").textContent = label(name);
  const box = $("rows"), you = rows.get("human");
  if (you && name !== "human") box.insertBefore(el, you.el); else box.appendChild(el);
  r = { name, el, nameEl: el.querySelector(".name"), task: el.querySelector(".task"),
        cost: el.querySelector(".cost"), thought: el.querySelector(".thought") };
  for (const ev of ["mouseenter", "focus"]) el.addEventListener(ev, () => { hover = name; kick(); });
  for (const ev of ["mouseleave", "blur"]) el.addEventListener(ev, () => { if (hover === name) hover = null; kick(); });
  rows.set(name, r);
  return r;
}
function set(el, text) { if (el.textContent !== text) el.textContent = text; }

function liveRow(p) {
  const r = row(p.name);
  r.el.classList.remove("unborn");
  const state = p.status === "waiting" || p.agent === "blocked" ? "waiting"
    : p.status === "resting" ? "resting"
    : !p.agent || p.agent === "absent" ? "absent"
    : p.agent === "working" ? "working" : "idle";
  r.el.dataset.state = state;
  const t = p.tasks[0];
  set(r.task, t ? t.title : state === "resting" ? "Resting until there's new work" : state === "absent" ? "Offline" : "Between tasks");
  r.task.title = t ? `${t.id}: ${t.title}` : "";
  set(r.cost, p.cost != null ? `$${p.cost.toFixed(2)}` : "");
  r.cost.title = p.ctx != null ? `${Math.round(p.ctx)}% of its memory is full` : "";
  let thought;
  if (state === "waiting") thought = "Waiting for your answer.";
  else if (state === "working") thought = p.activity || (p.cmd ? `Running ${p.cmd}` : "Working.");
  else thought = p.activity || "";
  set(r.thought, thought);
}
function youRow(humans, evs) {
  const r = row("human");
  r.el.dataset.state = humans.length ? "working" : "idle";
  const answered = evs.filter((e) => e.kind === "human" && who(e.by) === "human" && /answered/.test(e.text)).length;
  set(r.task, humans.length ? `${humans.length} question${humans.length > 1 ? "s" : ""} waiting. Answer with swarm human.`
                            : "Nothing needs you right now");
  set(r.cost, "");
  set(r.thought, humans.length ? humans.map((h) => h.text).join("  ") : `You've answered ${answered} question${answered === 1 ? "" : "s"} so far.`);
}

// ------------------------------------------------------------------ words
function strip(t) { return t.replace(/^[a-z][\w-]*: /, ""); }
function plain(e) {
  const t = e.text;
  switch (e.kind) {
    case "land": return "Landed a change: " + t.replace(/^landed on main: [0-9a-f]+ /, "");
    case "msg": return `To ${label(e.to)}: ${strip(t)}`;
    case "say": return "To everyone: " + strip(t);
    case "human": return who(e.by) === "human" ? "You answered: " + t.replace(/^H\d+ answered: /, "")
                                                : "Asked you: " + t.replace(/^H\d+ \(\w+\) /, "");
    default: return t[0].toUpperCase() + t.slice(1);
  }
}
function feedItem(e) {
  const by = who(e.by);
  if (e.kind === "msg") {
    let text = strip(e.text);
    const ans = /^(REVISED )?answer to H\d+ \((.*?)\): (now )?(.*)$/s.exec(text);
    if (ans) text = `${ans[1] ? "Changed the answer to" : "On"} “${ans[2]}” ${ans[4].replace(/\. Revisit anything.*$/s, "")}`;
    return { from: by, to: e.to, text };
  }
  if (e.kind === "say") return { from: by, to: "everyone", text: strip(e.text) };
  if (e.kind === "land") return { from: by, verb: "landed a change", text: e.text.replace(/^landed on main: [0-9a-f]+ /, "") };
  if (e.kind === "human" && by !== "human") return { from: by, to: "human", verb: "asked you", text: e.text.replace(/^H\d+ \(\w+\) /, "") };
  return null;
}
const nameTag = (n) => `<b style="--c:${color(n)}">${n === "everyone" ? "everyone" : label(n)}</b>`;
const escape = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let feedKey = "";
function renderFeed(evs, now) {
  const items = [];
  for (let i = evs.length - 1; i >= 0 && items.length < 7; i--) { const f = feedItem(evs[i]); if (f) items.push([evs[i], f]); }
  const key = items.map(([e]) => e.id).join() + "|" + Math.floor(now / 30);
  if (key === feedKey) return;
  feedKey = key;
  $("feed").innerHTML = items.length ? items.map(([e, f]) => {
    const head = f.verb ? `${nameTag(f.from)} ${f.verb}` : `${nameTag(f.from)} to ${nameTag(f.to)}`;
    return `<li class="item"><div class="who">${head}<time datetime="${new Date(e.at * 1000).toISOString()}">${replay ? clock(e.at) : ago(e.at, now)}</time></div><p>${escape(f.text)}</p></li>`;
  }).join("") : `<li class="empty">Waiting for the first message.</li>`;
}

function count(evs) {
  let landed = 0, msgs = 0;
  for (const e of evs) { if (e.kind === "land") landed++; if (e.kind === "msg") msgs++; }
  return { landed, msgs };
}
function story() {
  if (!events.length) return;
  const t0 = events[0].at;
  const n = snap ? snap.peers.length : joinOrder.length;
  const head = `${WORDS[n] ?? n} AI agents are building sliver, a Touch Bar app for Linux. None of them is in charge.`;
  set($("headline"), head);
  let lead;
  if (replay) {
    const c = count(visible());
    lead = `Replaying ${duration(replay.t1 - t0)} in under a minute. By ${clock(replay.at)} they had landed ` +
           `${int(c.landed)} change${c.landed === 1 ? "" : "s"} and sent each other ${int(c.msgs)} message${c.msgs === 1 ? "" : "s"}.`;
  } else if (snap) {
    const c = count(events);
    lead = `They split up the work themselves and message each other directly. In ${duration(Date.now() / 1000 - t0)} ` +
           `they've written ${int(snap.repo.loc || 0)} lines of Rust, landed ${int(c.landed)} changes and sent each other ` +
           `${int(c.msgs)} messages. So far it has cost $${(snap.cost || 0).toFixed(2)}.`;
  }
  if (lead) set($("lead"), lead);
}

// ------------------------------------------------------------------ the arcs
const canvas = $("arcs"), ctx = canvas.getContext("2d");
let hover = null, dots = [], rings = [], intro = null, pending = false;
function kick() { if (!pending) { pending = true; requestAnimationFrame(draw); } }
new ResizeObserver(kick).observe($("mesh"));

function geometry() {
  const box = $("mesh").getBoundingClientRect();
  const arcs = parseFloat(getComputedStyle($("mesh")).paddingLeft) || 0;
  const x = arcs - 22, pos = {};
  for (const [name, r] of rows) {
    const b = r.nameEl.getBoundingClientRect();
    pos[name] = b.top - box.top + b.height / 2;
  }
  return { box, x, pos };
}
let span = 1;   // the tallest possible arc, so bulges spread out instead of piling up at the edge
function curve(x, ya, yb) {
  const bulge = 10 + (x - 24) * Math.sqrt(Math.abs(yb - ya) / span);
  return [x, ya, x - bulge, ya, x - bulge, yb, x, yb];
}
function at(c, t) {
  const u = 1 - t, a = u * u * u, b = 3 * u * u * t, d = 3 * u * t * t, e = t * t * t;
  return [a * c[0] + b * c[2] + d * c[4] + e * c[6], a * c[1] + b * c[3] + d * c[5] + e * c[7]];
}
function length(c) { let L = 0, p = at(c, 0); for (let i = 1; i <= 24; i++) { const q = at(c, i / 24); L += Math.hypot(q[0] - p[0], q[1] - p[1]); p = q; } return L; }
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; }
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

function draw(now) {
  pending = false;
  now = now || performance.now();
  const { box, x, pos } = geometry(), dpr = devicePixelRatio || 1;
  if (canvas.width !== Math.round(box.width * dpr) || canvas.height !== Math.round(box.height * dpr)) {
    canvas.width = Math.round(box.width * dpr); canvas.height = Math.round(box.height * dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, box.width, box.height);
  if (x <= 0) return;
  let busy = false;

  const ys = Object.values(pos);
  span = Math.max(1, Math.max(...ys) - Math.min(...ys));
  const ls = links(visible()).filter((l) => pos[l.a] != null && pos[l.b] != null);
  ls.forEach((l, i) => {
    const c = curve(x, pos[l.a], pos[l.b]);
    const mine = hover && (l.a === hover || l.b === hover);
    // each line fades from one agent's color to the other's
    const alpha = hover ? (mine ? 0.95 : 0.07) : 0.5;
    const g = ctx.createLinearGradient(0, pos[l.a], 0, pos[l.b] + 0.01);
    g.addColorStop(0, rgba(color(l.a), alpha)); g.addColorStop(1, rgba(color(l.b), alpha));
    ctx.strokeStyle = g;
    ctx.lineWidth = Math.min(6, 0.8 + Math.sqrt(l.n) * 0.75);
    ctx.lineCap = "round";
    if (intro) {   // the mesh draws itself once, in the order the conversations began
      const k = Math.max(0, Math.min(1, (now - intro - i * (900 / Math.max(1, ls.length))) / 700));
      if (k < 1) busy = true;
      ctx.setLineDash([length(c) * ease(k), 1e5]);
    } else ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(c[0], c[1]); ctx.bezierCurveTo(c[2], c[3], c[4], c[5], c[6], c[7]); ctx.stroke();
  });
  ctx.setLineDash([]);
  if (intro && !busy) intro = null;

  // a message in flight: a dot running from sender to receiver
  dots = dots.filter((d) => {
    if (pos[d.a] == null || pos[d.b] == null) return false;
    const t = (now - d.t0) / d.dur;
    if (t >= 1) { rings.push({ name: d.b, c: d.c, t0: now }); return false; }
    if (t < 0) { busy = true; return true; }
    const [px, py] = at(curve(x, pos[d.a], pos[d.b]), ease(t));
    ctx.fillStyle = d.c; ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();
    busy = true; return true;
  });
  rings = rings.filter((g) => {
    const t = (now - g.t0) / 600; if (t >= 1 || pos[g.name] == null) return false;
    ctx.strokeStyle = rgba(g.c, 0.6 * (1 - t)); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, pos[g.name], 6 + 10 * t, 0, Math.PI * 2); ctx.stroke();
    busy = true; return true;
  });

  // one node per agent: filled while it's working, an open ring otherwise
  for (const [name, r] of rows) {
    if (pos[name] == null) continue;
    const c = color(name), on = r.el.dataset.state === "working" || r.el.dataset.state === "waiting";
    ctx.globalAlpha = r.el.classList.contains("unborn") ? 0.3 : 1;
    ctx.beginPath(); ctx.arc(x, pos[name], 5.5, 0, Math.PI * 2);
    if (on) { ctx.fillStyle = c; ctx.fill(); }
    else { ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--paper"); ctx.fill(); ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
  if (busy) kick();
}
function send(e, dur = 1300) {
  const p = ends(e);
  if (!p || REDUCED) return;
  dots.push({ a: p[0], b: p[1], c: color(p[0]), t0: performance.now(), dur });
  kick();
}

// ------------------------------------------------------------------ data
async function refresh() {
  let s;
  try { s = await (await fetch("/api/snapshot")).json(); } catch { return; }
  snap = s;
  if (replay) return;
  const st = $("status");
  st.className = "status" + (s.paused ? " paused" : "");
  set($("statusText"), s.paused ? "Paused" : "Live");
  for (const p of s.peers) liveRow(p);
  for (const [name, r] of rows) if (name !== "human" && !s.peers.some((p) => p.name === name)) { r.el.remove(); rows.delete(name); }
  youRow(s.humans, events);
  story(); renderFeed(events, Date.now() / 1000); kick();
}
function ingest(e) {
  events.push(e);
  const s = spawnedName(e); if (s && !joinOrder.includes(s)) joinOrder.push(s);
}
function connect() {
  const es = new EventSource("/api/stream");
  es.addEventListener("history", (m) => {
    events = []; JSON.parse(m.data).forEach(ingest); live = true;
    if (!REDUCED && intro === null && !replay) intro = performance.now();
    story(); renderFeed(events, Date.now() / 1000); kick();
    if (new URLSearchParams(location.search).has("replay")) startReplay();
  });
  es.onmessage = (m) => {
    const e = JSON.parse(m.data); ingest(e);
    if (live && !replay) { send(e); renderFeed(events, Date.now() / 1000); story(); }
  };
  es.onerror = () => { es.close(); live = false; setTimeout(connect, 2000); };
}

// ------------------------------------------------------------------ replay
function startReplay() {
  if (!events.length) return;
  const t0 = events[0].at, t1 = events[events.length - 1].at, seconds = 50;
  replay = { at: t0, t0, t1, rate: Math.max(1, (t1 - t0) / seconds), started: performance.now(), next: 0 };
  $("status").className = "status replay"; set($("statusText"), "Replay");
  $("replay").innerHTML = "Back to live";
  for (const name of joinOrder) { const r = row(name); r.el.classList.add("unborn"); r.el.dataset.state = "idle"; set(r.thought, ""); set(r.cost, ""); }
  intro = null; dots = []; rings = [];
  const tick = () => {
    if (!replay) return;
    replay.at = Math.min(replay.t1, t0 + ((performance.now() - replay.started) / 1000) * replay.rate);
    while (replay.next < events.length && events[replay.next].at <= replay.at) send(events[replay.next++], 900);
    const seen = visible(), born = new Set(seen.map(spawnedName).filter(Boolean));
    for (const name of joinOrder) {
      const r = rows.get(name); if (!r) continue;
      const mine = seen.filter((e) => who(e.by) === name && e.kind !== "task");
      const lastEv = mine[mine.length - 1];
      const busy = lastEv && (replay.at - lastEv.at) / replay.rate < 1.5;
      r.el.classList.toggle("unborn", !born.has(name));
      r.el.dataset.state = born.has(name) && busy ? "working" : "idle";
      set(r.thought, born.has(name) && lastEv ? plain(lastEv) : born.has(name) ? "" : "Not here yet.");
      const claimed = seen.filter((e) => e.by === name && e.kind === "task" && /^claimed T\d+: /.test(e.text)).pop();
      set(r.task, claimed ? claimed.text.replace(/^claimed T\d+: /, "") : "");
    }
    const you = rows.get("human");
    if (you) { set(you.task, ""); set(you.thought, ""); you.el.dataset.state = "idle"; }
    story(); renderFeed(seen, replay.at); kick();
    if (replay.at >= replay.t1) { setTimeout(stopReplay, 2500); return; }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function stopReplay() {
  if (!replay) return;
  replay = null; dots = []; rings = [];
  $("replay").innerHTML = 'Replay<span class="long"> the whole build</span>';
  for (const r of rows.values()) r.el.classList.remove("unborn");
  feedKey = ""; refresh();
}
$("replay").addEventListener("click", () => (replay ? stopReplay() : startReplay()));
document.addEventListener("keydown", (k) => { if (k.key === "Escape" && replay) stopReplay(); });

connect();
refresh(); setInterval(refresh, 2500);
</script>
</body>
