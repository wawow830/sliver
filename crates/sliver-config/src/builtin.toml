# Sliver's built-in defaults, merged underneath the user's config (sliver-config(5)).
version = 1

[layers]
base = "default"
fn = "fkeys"
media = "media"
emoji = "emoji"           # opened with { layer = "emoji", mode = "toggle" }

[[layouts.default.zones]]
name = "esc"
modules = ["key/Esc#auto"]

[[layouts.default.zones]]
name = "main"
width = "fill"
# 2008 px Macs have no F-key row and most Linux apps publish no controls: F1-F12 show until the
# focused app publishes some.
modules = ["app-controls", "group/fkeys"]

[[layouts.default.zones]]
name = "controls"
modules = ["status-items", "mpris", "group/control-strip", "backlight/slider", "audio/slider", "key/Mute"]

# tiny-dfr's primary layer.
[[layouts.fkeys.zones]]
name = "esc"
modules = ["key/Esc#auto"]

[[layouts.fkeys.zones]]
name = "main"
width = "fill"
module-width = "fill"
modules = ["key/F1", "key/F2", "key/F3", "key/F4", "key/F5", "key/F6",
           "key/F7", "key/F8", "key/F9", "key/F10", "key/F11", "key/F12"]

# tiny-dfr's media layer.
[[layouts.media.zones]]
name = "esc"
modules = ["key/Esc#auto"]

[[layouts.media.zones]]
name = "main"
width = "fill"
module-width = "fill"
modules = ["key/BrightnessDown", "key/BrightnessUp", "key/MicMute", "key/Search",
           "key/IllumDown", "key/IllumUp", "key/PreviousSong", "key/PlayPause",
           "key/NextSong", "key/Mute", "key/VolumeDown", "key/VolumeUp"]

# Lock screen: no module that shows content. The agent also hides private content while locked,
# whatever the layout says.
[[layouts.locked.zones]]
name = "esc"
modules = ["key/Esc#auto"]

[[layouts.locked.zones]]
name = "main"
width = "fill"
align = "center"
modules = ["key/PreviousSong", "key/PlayPause", "key/NextSong"]

[[layouts.locked.zones]]
name = "controls"
modules = ["backlight/slider#locked", "audio/slider#locked", "key/Mute"]

[[layouts.emoji.zones]]
name = "esc"
modules = ["key/Esc#auto"]

[[layouts.emoji.zones]]
name = "main"
width = "fill"
modules = ["emoji#strip"]

# Esc only where the Mac has no physical Esc key (2170 px bars), as tiny-dfr does. An unknown
# physical-esc shows Esc.
# Not `physical-esc = false`: when it is unknown, Esc shows.
[modules."key/Esc#auto"]
when = { not = { physical-esc = true } }

[modules."group/control-strip"]
modules = ["custom/expand", "kbd-backlight/slider", "key/MicMute",
           "key/PreviousSong", "key/PlayPause", "key/NextSong"]
drawer = { reveal = "tap", mode = "inline", collapse-after = "5s" }

[modules."group/fkeys"]
modules = ["key/F1", "key/F2", "key/F3", "key/F4", "key/F5", "key/F6",
           "key/F7", "key/F8", "key/F9", "key/F10", "key/F11", "key/F12"]
module-width = "fill"
# An unknown app-controls state shows the F-keys.
when = { not = { app-controls = true } }

[modules."custom/expand"]
format = "‹"

[modules."backlight/slider"]
collapsed = true

[modules."audio/slider"]
collapsed = true

[modules.mpris]
format = "{status_icon} {title}"
max-length = 24
hide-empty-text = true

[modules."emoji#strip"]
mode = "strip"

# Sparklines, ready to place.
[modules."graph#cpu"]
source = "cpu"

[modules."graph#memory"]
source = "memory"

# Notification text is hidden while the screen is shared; `when = {}` in [modules.notifications]
# overrides it.
[modules.notifications]
when = { not = { screencast = true } }

[modules."backlight/slider#locked"]
collapsed = false

[modules."audio/slider#locked"]
collapsed = false

# First match wins. A user [[rules]] list replaces this one (arrays replace).
[[rules]]
name = "Locked screen"
when = { locked = true }
layout = "locked"
