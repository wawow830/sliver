[package]
name = "sliver-settings"
description = "Sliver settings app and WYSIWYG Touch Bar editor (GTK4 + libadwaita)"
version.workspace = true
edition.workspace = true
# gtk-rs 0.11 needs 1.92.
rust-version = "1.92"
repository.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sliver-cli.workspace = true
sliver-config.workspace = true
sliver-import.workspace = true
sliver-render.workspace = true
sliver-agent.workspace = true
sliver-ipc.workspace = true
sliver-icons.workspace = true
sliver-emoji.workspace = true
toml.workspace = true
zbus.workspace = true
chrono.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
