[package]
name = "sliver-agent"
description = "Sliver per-user session agent: compositor tracking, public D-Bus API, widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sliver-config.workspace = true
sliver-icons.workspace = true
sliver-ipc.workspace = true
sliver-render.workspace = true
rustix = { workspace = true, features = ["event", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
sliver-ipc = { workspace = true, features = ["fake"] }
