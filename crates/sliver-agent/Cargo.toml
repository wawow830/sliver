[package]
name = "sliver-agent"
description = "Sliver per-user session agent: compositor tracking, public D-Bus API, widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sliver-cli.workspace = true
sliver-bus.workspace = true
sliver-api.workspace = true
sliver-config.workspace = true
toml.workspace = true
sliver-desktop.workspace = true
sliver-proc.workspace = true
sliver-session.workspace = true
sliver-icons.workspace = true
sliver-ipc.workspace = true
sliver-render.workspace = true
rustix = { workspace = true, features = ["event", "time", "pipe", "fs"] }
zbus.workspace = true
signal-hook = "0.3"
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
chrono = { workspace = true, features = ["unstable-locales"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
xkbcommon = { version = "0.8", default-features = false }

[dev-dependencies]
sliver-testbus.workspace = true
sliverd = { workspace = true, features = ["testing"] }
