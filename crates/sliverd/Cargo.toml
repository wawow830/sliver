[package]
name = "sliverd"
description = "Sliver system daemon: owns the Touch Bar display, touch input, backlight and key emission"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sliver-hw.workspace = true
sliver-ipc.workspace = true
sliver-render.workspace = true
rustix.workspace = true
serde.workspace = true
toml.workspace = true

[features]
# sliverd::testing::TestDaemon for other crates' tests (the agent's). The daemon binary never needs it.
testing = []

[dev-dependencies]
# This crate's own tests use the testing module.
sliverd = { path = ".", features = ["testing"] }
