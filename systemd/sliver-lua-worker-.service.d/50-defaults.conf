[Service]
# The worker is a disposable user process. Keep these defaults in systemd so
# administrators can replace them with a drop-in for generated worker units.
MemoryAccounting=yes
MemoryMax=512M
TasksAccounting=yes
TasksMax=64
OOMPolicy=kill
KillMode=control-group
TimeoutStopSec=1s
NoNewPrivileges=yes
PrivateDevices=yes
DevicePolicy=closed
ProtectKernelTunables=yes
StandardInput=null
StandardOutput=journal
StandardError=journal
SyslogIdentifier=sliver-lua
Restart=no
WatchdogSec=0
