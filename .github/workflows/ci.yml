name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The gate runs as an ordinary user, like on a developer's machine: user modules refuse to run
  # as root, and so would their tests.
  CARGO_HOME: /home/ci/.cargo
  RUSTUP_HOME: /home/ci/.rustup

jobs:
  check:
    # Native aarch64 on the distro sliver targets: the settings app needs GTK 4.22 and
    # libadwaita 1.8, which Fedora 44 ships and Ubuntu doesn't.
    runs-on: ubuntu-24.04-arm
    container:
      image: fedora:44
      # An init that reaps orphans, as on a real system: tests check that killed process trees are
      # gone, and an unreaped zombie still counts as there.
      options: --init
    steps:
      - name: System packages and the ci user
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc pkgconf-pkg-config gtk4-devel libadwaita-devel libxkbcommon-devel \
            dbus-daemon groff systemd systemd-udev rpm-build desktop-file-utils libxml2 \
            nodejs python3 procps-ng fontconfig dejavu-sans-fonts curl util-linux
          useradd -m ci
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: chown -R ci:ci "$GITHUB_WORKSPACE" /home/ci
      - name: scripts/check
        run: |
          runuser -u ci -- sh -ec '
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$CARGO_HOME/bin:$PATH"
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            cd "$GITHUB_WORKSPACE"
            rustup toolchain install   # the version in rust-toolchain.toml
            scripts/check
          '
