name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A validator skipped for a missing tool fails the gate.
  SLIVER_CHECK_ALL: "1"
  # Runs as an ordinary user: user modules refuse to run as root, and so do their tests.
  CARGO_HOME: /home/ci/.cargo
  RUSTUP_HOME: /home/ci/.rustup

jobs:
  check:
    # Fedora: the packaging is an RPM, and the gate checks its spec with rpmspec.
    runs-on: ubuntu-24.04-arm
    container:
      image: fedora:44
      # An init that reaps orphans: tests check that killed process trees are gone, and an
      # unreaped zombie still counts as present.
      options: --init
    steps:
      - name: System packages and the ci user
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git gcc pkgconf-pkg-config libxkbcommon-devel \
            dbus-daemon groff systemd systemd-udev rpm-build \
            nodejs python3 python3-gobject procps-ng fontconfig dejavu-sans-fonts util-linux rustup
          useradd -m ci
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: chown -R ci:ci "$GITHUB_WORKSPACE" /home/ci
      - name: scripts/check
        run: |
          runuser -u ci -- sh -ec '
            rustup-init -y --profile minimal --default-toolchain none
            export PATH="$CARGO_HOME/bin:$PATH"
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            cd "$GITHUB_WORKSPACE"
            rustup toolchain install   # the version in rust-toolchain.toml
            scripts/check
          '
